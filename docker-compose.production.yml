services:
  app:
    # 🔴 `:?` er BÆRENDE, ikke stil. Med `:-latest` valgte compose et 6 uger
    # gammelt image, da kommandoen blev kørt uden `--env-file .env.production`
    # ([infra], #221, målt på image-ID i prod). `latest` publiceres ikke af
    # release-flowet, så det er ALDRIG det rigtige svar — fail-fast i stedet.
    image: ghcr.io/30blackbirds/grundtone-studio:${IMAGE_TAG:?IMAGE_TAG mangler — kør med --env-file .env.production}
    env_file: .env.production
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      # /api/auth/session 404s (Better Auth's real route is get-session), which
      # left the container permanently "unhealthy" on every version until
      # [infra] caught it 2026-07-29. /api/healthz is the actual health route
      # (same one the deploy workflow smokes).
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/api/healthz']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    networks: [internal]
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
