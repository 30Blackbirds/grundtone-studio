# SonarQube — self-hostet paa sonar.klanghaus.dk (EU, egen VM).
#
# Ét projekt for hele monorepoet. Guidens "gentag for alle projekter i dit
# monorepo" giver mening naar delene udgives og ejes uafhaengigt — her er
# apps/studio produktet og packages/* dets SDK, med samme release-tog.
sonar.projectKey=KlangHaus_grundtone-studio_70e016be-487e-43d3-838b-c99c8e51e21e
sonar.projectName=grundtone-studio
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,scripts
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/tests/**

# `.nuxt` og `.output` er genereret; `docker/` er drift, ikke applikationskode.
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/.nuxt/**,**/.output/**,**/*.d.ts,**/migrations/**

# 🔴 Uden denne linje melder Sonar 0% — og et nul laeses som en regression,
# ikke som manglende konfiguration. Stierne skal matche hvad `test:coverage`
# faktisk skriver; se apps/studio/vitest.config.ts.
sonar.javascript.lcov.reportPaths=apps/studio/coverage/lcov.info

# 🔴 Kun apps/studios lcov staar her. En tidligere udgave listede ogsaa
# packages/saas-client/coverage/lcov.info — men saas-client har hverken et
# `test:coverage`-script eller en lcov-reporter, saa filen bliver ALDRIG
# skrevet. Sonar advarer om den manglende fil i loggen og behandler kilderne
# som utestede. **En sti til en fil der ikke findes, er ikke en maaling der
# mangler — det er et nul der ligner en maaling.**

# 🔴 NAEVNEREN skal matche det vi faktisk maaler. `sonar.sources` daekker hele
# traeet, men lcov'en daekker kun studios server/lib/composables/utils. Uden
# de her udelukkelser tegner Sonar alt andet som 0% og udgiver en procent der
# er et delmaal maalt mod helheden.
#
# Udelukkelserne siger altsaa ikke "denne kode er ligegyldig" — de siger
# "denne kode indgaar ikke i daekningstallet endnu". Skal en af dem med,
# hoerer den til i vitest-configens `include` FOERST, og saa herfra bagefter.
sonar.coverage.exclusions=\
  apps/studio/pages/**,\
  apps/studio/components/**,\
  apps/studio/layouts/**,\
  apps/studio/middleware/**,\
  apps/studio/plugins/**,\
  apps/studio/i18n/**,\
  apps/studio/scripts/**,\
  packages/**,\
  scripts/**
