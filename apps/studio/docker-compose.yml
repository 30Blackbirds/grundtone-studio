services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grundtone
      POSTGRES_PASSWORD: grundtone_dev
      POSTGRES_DB: grundtone_studio
    ports:
      - '54320:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grundtone -d grundtone_studio']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: grundtone
      MINIO_ROOT_PASSWORD: grundtone_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 grundtone grundtone_dev;
      mc mb --ignore-existing local/grundtone-studio;
      mc anonymous set download local/grundtone-studio;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
