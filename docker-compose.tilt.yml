# Tilt compose-fragment for grundtone-studio (Nuxt 3, central auth + permissions).
# Auto-loaded af KlangHaus/infra/tilt/Tiltfile når repoet ligger som sibling
# (~/repos/klanghaus/grundtone-studio/). Studio er customer-facing men loades
# her for at give workers et samlet end-til-end-test-miljø.
#
# Auth: studio er nu ren consumer af central [auth] (JWT/JWKS) + [permissions]-PDP.
# Port-kanon: studio=3000, auth host=3002→container=3000, permissions=3001.

name: klanghaus-local

services:
  grundtone-studio:
    image: ghcr.io/klanghaus/grundtone-studio:local
    build:
      context: ../../grundtone-studio
      dockerfile: ../../grundtone-studio/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NITRO_PORT: '3000'
      NITRO_HOST: 0.0.0.0
      # Egen dedikeret database i samme Postgres-instans
      DATABASE_URL: postgres://klanghaus:localdev@postgres:5432/grundtone_studio
      # Central auth (Beslutning D) via API-gateway'en (lokal api.klanghaus.dk-
      # stand-in, http://localhost:8000). iss/aud-claim + browser-auth-client
      # peger på gateway-origin; studios server henter JWKS + token-exchange via
      # den interne container-adresse (auth:3000) — server-til-server, ingen CORS.
      AUTH_ISSUER: http://localhost:8000
      AUTH_AUDIENCE: http://localhost:8000
      AUTH_INTERNAL_URL: http://auth:3000
      NUXT_PUBLIC_AUTH_URL: http://localhost:8000
      # Central permissions PDP (Connect-RPC, container-intern)
      PERMISSIONS_URL: http://permissions:3001
      # Studio refuses to write permission tuples without a SERVICE token
      # (server/lib/pdp.ts serviceClient: 503 otherwise, which projects.post
      # turns into "Failed to register project permissions"). In Tilt the
      # permissions service runs with JWT verification DISABLED (no
      # PERMISSIONS_JWT_ISSUER/JWKS_URL), so any non-empty value passes here.
      # DEV-ONLY placeholder, not a credential: prod mints a real token with
      # auth's mint-s2s CLI (sub=service:grundtone-studio, aud=klanghaus-pdp).
      PDP_S2S_TOKEN: tilt-local-placeholder-not-a-credential
      # S3 → MinIO i backing-infra
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: grundtone-studio-local
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Email via Mailpit (lokal SMTP-catcher)
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      EMAIL_FROM: 'Grundtone Studio <noreply@grundtone.local>'
      # Nuxt public — host's view (browser laver requests fra host, så bruger localhost)
      NUXT_PUBLIC_APP_URL: http://localhost:3000
      NUXT_PUBLIC_CDN_BASE: http://localhost:3000
      SENTRY_DSN: ''
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      auth:
        condition: service_healthy
      permissions:
        condition: service_healthy
    healthcheck:
      # /login er en public Nuxt-side (auth-decision public paths) — studio ejer
      # ikke længere /api/auth/* (central auth gør).
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/login']
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
