name: 'Setup workspace'
description: 'pnpm + Node + frozen-lockfile install. Shared across all CI jobs.'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      # Studio konsumerer private @klanghaus-pakker (auth-jwt + permissions-client)
      # fra GitHub Packages — .npmrc auth'er @klanghaus-scope via NODE_AUTH_TOKEN.
      # github.token (workflow-GITHUB_TOKEN) har read:packages når pakken giver
      # dette repo Actions-adgang (samme mønster som auth/quality-config).
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
