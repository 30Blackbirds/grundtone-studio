name: 'Setup workspace'
description: 'pnpm + Node + frozen-lockfile install. Shared across all CI jobs.'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      # No registry token: @klanghaus/auth-jwt and permissions-client are
      # vendored in apps/studio/server/vendor/ (#354), every dependency is public,
      # and .npmrc no longer names a private registry.
