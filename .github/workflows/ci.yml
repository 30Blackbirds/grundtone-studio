name: CI

# 🔴 INGEN `paths-ignore` HER — og det er ikke en forglemmelse.
#
# 10 af `main`s 13 required checks kommer fra denne fil. Med et sti-filter
# koerer de slet ikke paa en PR der kun roerer markdown — og en required check
# der ikke rapporterer BLOKERER. Ikke roedt: "Expected — waiting for status",
# i al evighed.
#
# Maalt paa PR #213 (aendrede kun CONTRIBUTING.md), foer dette fix:
#   required:                     13
#   rapporterede paa PR'en:        3
#   rapporterede ALDRIG:          10
#   mergeStateStatus:         BLOCKED
#
# Defekten havde ligget latent lige saa laenge listen har vaeret required;
# docs-only-PR'er er sjaeldne, saa #213 var den foerste der ramte den.
#
# Alternativet — beholde filteret og flytte det ind paa TRINNENE, saa jobbene
# altid konkluderer under deres stabile navn — er formen vi bruger i
# build.yml, hvor image-buildet er dyrt. Her koster hele suiten faa minutter,
# og ti jobs med hver sin gate-betingelse er mere maskineri end besparelsen
# er vaerd. **Vaelger nogen senere at genindfoere filtrering: paa trinnene,
# aldrig paa jobbet eller paa `on:`.**
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run in parallel so each check surfaces as its own status on the PR
# ("CI / ESLint", "CI / TypeScript", etc.). The shared `Setup workspace`
# composite action handles checkout + pnpm + node + install for every job;
# the runner-level pnpm cache from actions/setup-node makes the second-run
# install essentially free.

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm stylelint

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # nuxt typecheck imports from server/db at type-check time; without a
      # DATABASE_URL the Drizzle config refuses to load. The check never hits
      # the wire, so any well-formed URL is fine.
      DATABASE_URL: postgresql://grundtone:typecheck@127.0.0.1:5432/grundtone_studio
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grundtone
          POSTGRES_PASSWORD: grundtone_ci
          POSTGRES_DB: grundtone_studio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grundtone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://grundtone:grundtone_ci@127.0.0.1:5432/grundtone_studio
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: grundtone-studio
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-secret
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Apply migrations
        run: pnpm --filter @grundtone-studio/studio db:migrate
      - name: Test
        run: pnpm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Hard-fail on high or critical CVEs in the production dep tree. If a
      # transitive dep has a real advisory, the right answer is to bump it
      # (or pnpm.overrides it) rather than soften the check. Moderate and low
      # advisories still pass — Dependabot surfaces them as separate PRs.
      - run: pnpm audit --prod --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://grundtone:build@127.0.0.1:5432/grundtone_studio
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: grundtone-studio
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-secret
      TURBO_TELEMETRY_DISABLED: 1
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-develop-
            turbo-main-

      - name: Build
        run: pnpm build

      - name: Bundle size check
        # Reads .output/public/ + .output/server/ from the build above,
        # compares against thresholds in apps/studio/.size-limit.json, and
        # fails the run if any chunk exceeds its budget.
        run: pnpm --filter @grundtone-studio/studio bundle:size

  # The extension points a private Nuxt layer builds on, checked from the
  # outside (apps/studio/contract/README.md): a fixture layer is placed where
  # Nuxt registers layers, Studio is built and started, and contract/check.mjs
  # asks the running server whether each registration took effect.
  extension-contract:
    name: Extension contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://grundtone:contract@127.0.0.1:5432/grundtone_studio
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Place the fixture layer
        run: cp -R apps/studio/contract/layer apps/studio/layers/contract
      - name: Build Studio with the fixture layer
        run: pnpm --filter @grundtone-studio/studio build
      # No database: nothing the check asks for reads one. CONTRACT_FLAG is the
      # fixture's own required switch (it uses parseRuntimeFlag).
      - name: Start the built server
        working-directory: apps/studio
        env:
          PORT: '3000'
          HOST: 127.0.0.1
          NODE_ENV: production
          AUTHORIZER: local
          CONTRACT_FLAG: 'on'
          AUTH_ISSUER: http://127.0.0.1:9
          AUTH_AUDIENCE: http://127.0.0.1:9
          NUXT_PUBLIC_AUTH_URL: http://127.0.0.1:3000
          NUXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NUXT_PUBLIC_CDN_BASE: http://127.0.0.1:3000
        run: |
          node .output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "::error::the server did not answer /api/healthz within 60 s"
          cat server.log
          exit 1
      - name: Check the extension contract
        working-directory: apps/studio
        run: node contract/check.mjs http://127.0.0.1:3000
      - name: Server log
        if: failure()
        working-directory: apps/studio
        run: cat server.log

  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # drizzle-kit generate doesn't talk to the DB, but the config still
      # reads DATABASE_URL at module-load time. Any well-formed URL works.
      DATABASE_URL: postgresql://grundtone:drift@127.0.0.1:5432/grundtone_studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generate migrations from schema
        run: pnpm db:generate
      - name: Fail if generated files differ from committed
        run: |
          if [[ -n "$(git status --porcelain apps/studio/server/db/migrations)" ]]; then
            echo "::error::Schema changed without a regenerated migration. Run \`pnpm db:generate\` locally and commit the result."
            git status apps/studio/server/db/migrations
            git --no-pager diff apps/studio/server/db/migrations
            exit 1
          fi
          echo "✓ migrations are in sync with schema"

  i18n-parity:
    name: i18n parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # No pnpm install needed — the script is plain Node + node:fs.
      - run: node scripts/check-i18n-parity.mjs

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # raven-actions/actionlint shells out to `npm install` from the repo
      # root, which reads our package.json `engines: { node: ">=24" }` and
      # rejects the default runner Node (22). setup-node bumps the runner to
      # the pinned version before the actionlint action runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # 🔴 Koerbart vaern for .github/scripts/cosign-sig-ref.sh. Det ligger
      # her og ikke i en commit-besked, fordi en engangsmaaling er en
      # PAASTAND: de tre tag-format-tilstande var testet én gang lokalt mod
      # stubs der aldrig blev committet, saa [review] kunne ikke genskabe
      # dem, og ingen ville opdage hvis scriptet holdt op med at virke.
      #
      # En hardkodet antagelse om ét tag-format gjorde main roed TO gange
      # (#245, #246). Testen er selv mutationstestet: den fanger begge
      # hardkodninger og et manglende exit 1 naar intet artefakt findes.
      - name: Cosign sig-ref script guard
        run: ./.github/scripts/cosign-sig-ref.test.sh
      - name: Cosign identity script guard
        run: ./.github/scripts/cosign-identity.test.sh

      # 🔴 Tag-order guard (riff ap1qcpe7zg3j8ex5ton6d4i1): no image tag may be
      # published before the digest is signed and verified. The test runs the
      # guard on the real build.yml and on mutants that recreate the race
      # window; each mutant must fail for its own reason.
      # PyYAML: the runner's if present, otherwise a hash-locked install into
      # a venv (a venv avoids PEP 668 on the system Python). The step prints
      # which path it took, so the first run measures the runner.
      - name: Tag-order guard (tags only after sign + verify)
        run: |
          set -euo pipefail
          if python3 -c "import yaml" 2>/dev/null; then
            PY=python3
            echo "PyYAML: runner's own"
          else
            python3 -m venv "$RUNNER_TEMP/pyyaml"
            "$RUNNER_TEMP/pyyaml/bin/pip" install --quiet --require-hashes -r .github/scripts/pyyaml-requirements.txt
            PY="$RUNNER_TEMP/pyyaml/bin/python"
            echo "PyYAML: hash-locked venv install"
          fi
          echo "python $("$PY" -c 'import sys;print(sys.version.split()[0])') · PyYAML $("$PY" -c 'import yaml;print(yaml.__version__)')"
          PYTHON="$PY" ./.github/scripts/assert-tags-after-verify.test.sh
