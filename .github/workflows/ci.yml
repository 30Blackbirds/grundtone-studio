name: CI

on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**', '.github/dependabot.yml']
  push:
    branches: [develop, main]
    paths-ignore: ['**.md', 'docs/**', '.github/dependabot.yml']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grundtone
          POSTGRES_PASSWORD: grundtone_ci
          POSTGRES_DB: grundtone_studio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grundtone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO service intentionally omitted — bitnami/minio:latest was
      # deprecated, and no current test actually hits S3. The integration
      # tests in #67 will bring back a MinIO service (likely minio/minio:latest
      # with a separate bucket-create step, since the official image lacks
      # MINIO_DEFAULT_BUCKETS).

    env:
      DATABASE_URL: postgresql://grundtone:grundtone_ci@127.0.0.1:5432/grundtone_studio
      BETTER_AUTH_SECRET: ci-secret-not-for-production-use-only
      BETTER_AUTH_URL: http://localhost:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: grundtone-studio
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci-secret
      TURBO_TELEMETRY_DISABLED: 1
      # Turbo remote cache. Both vars come from repo secrets; if unset
      # (e.g. on PRs from forks), Turbo silently falls back to the local
      # cache and CI still works — just slower on cold runs.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.ref_name }}-
            turbo-develop-
            turbo-main-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order is fail-fast: cheap formatting checks first, then linters,
      # then typecheck, tests, and finally the heaviest step (build).
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Stylelint
        run: pnpm stylelint

      - name: Apply migrations
        run: pnpm --filter @grundtone-studio/studio db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies (high + critical)
        run: pnpm audit --prod --audit-level=high
        # Hard-fail on high or critical CVEs in the production dep tree.
        # If a transitive dep has a real advisory, the right answer is to
        # bump it (or pnpm.overrides it) rather than restoring `|| true`.
        # Moderate and low advisories still pass — Dependabot surfaces
        # them as separate PRs when fixes are available.

      - name: Build
        run: pnpm build

      - name: Bundle size check
        run: pnpm --filter @grundtone-studio/studio bundle:size
        # Reads .output/public/ + .output/server/ from the build above,
        # compares against thresholds in apps/studio/.size-limit.json,
        # and fails the run if any chunk exceeds its budget. Keeps us
        # from accidentally regressing the SDK or studio chunks.
