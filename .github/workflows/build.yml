name: Build and deploy

on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Cancel earlier runs of the same ref so the latest commit wins; never cancel
# tag deploys, those must always complete or fail loudly.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build the studio image and push to GHCR. Tags include sha + branch +
  # semver-on-tags so deploys can pin to a specific image.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Boot-smoke (v0.2.11-incident, 2026-08-03): the image MUST come up and
      # answer healthz + serve a real page before any deploy job may run. The
      # v0.2.11 crashloop (Nitro dropped transitive OTel deps from the runtime
      # node_modules) booted fine locally — only the pruned image failed, so
      # only running the actual image catches this class. Dummy env: the app
      # boots without real backends; pages render SSR shells. OTel endpoint is
      # set ON so the telemetry path is exercised, not skipped.
      - name: Boot-smoke the image
        # Entrypointet kører migrationer FØR serveren starter (afdækket af den
        # første boot-smoke-kørsel: dummy-DB → migrate-crash før noget andet).
        # En rigtig Postgres-sidecar gør smoken trofast — og validerer samtidig
        # at migrationskæden kører rent mod en tom database.
        run: |
          docker network create smokenet
          docker run -d --name smokedb --network smokenet \
            -e POSTGRES_PASSWORD=smoke postgres:16-alpine
          for i in $(seq 1 15); do
            docker exec smokedb pg_isready -U postgres > /dev/null 2>&1 && break
            [ "$i" = 15 ] && { echo "✗ postgres-sidecar kom aldrig op"; exit 1; }
            sleep 2
          done
          docker run -d --name bootsmoke --network smokenet -p 3000:3000 \
            -e DATABASE_URL="postgres://postgres:smoke@smokedb:5432/postgres" \
            -e NUXT_PUBLIC_AUTH_URL="http://127.0.0.1:9" \
            -e OTEL_EXPORTER_OTLP_ENDPOINT="http://127.0.0.1:4318" \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for i in $(seq 1 18); do
            if curl -sf http://127.0.0.1:3000/api/healthz > /dev/null; then
              echo "✓ image boots (healthz)"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' bootsmoke)" != "true" ]; then
              echo "✗ container died during boot"; docker logs bootsmoke | tail -50; exit 1
            fi
            [ "$i" = 18 ] && { echo "✗ boot-smoke timed out"; docker logs bootsmoke | tail -50; exit 1; }
            sleep 5
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/login)
          [ "$code" = "200" ] || { echo "✗ /login returned $code in boot-smoke"; docker logs bootsmoke | tail -50; exit 1; }
          echo "✓ /login 200 in boot-smoke"
          docker rm -f bootsmoke smokedb
          docker network rm smokenet

      - name: Pick the canonical deploy tag
        id: tag
        # Tag pushes deploy the semver tag (X.Y.Z); branch pushes use the
        # short SHA so each commit is independently rollback-able.
        # OBS: vi STRIPPER 'v'-prefiks fra ref_name fordi docker/metadata-action
        # publisher imaget som '0.1.3', ikke 'v0.1.3' (default semver-pattern).
        # Hvis vi ikke stripper, fejler deploy-job med "manifest unknown".
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            REF="${{ github.ref_name }}"
            echo "value=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # scope=studio-v2 (2026-08-03): bust af stale buildx-gha-cache —
          # CI-imaget manglede @opentelemetry/* komplet selv om et frisk build
          # af samme commit indeholder dem (lokalt verificeret: identisk
          # Dockerfile+context bygger korrekt og booter grønt). Gamle cache-
          # layers fra før traceInclude/deref-fixene blev genbrugt på tværs af
          # runs. Bump scope-suffikset ved fremtidige stale-cache-mistanker.
          cache-from: type=gha,scope=studio-v2
          cache-to: type=gha,mode=max,scope=studio-v2
          provenance: false
          # Privat @klanghaus-pakke-adgang: Dockerfile'en mounter dette som
          # `--mount=type=secret,id=node_auth_token`. Uden det fejler pnpm install
          # med 401 på @klanghaus/auth-jwt m.fl. GITHUB_TOKEN har packages:read i
          # org (kræver at de pakker grant'er denne repo Actions-adgang).
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Auto-deploy to staging on every successful develop build.
  # Uses GitHub Environment `staging` — keep secrets scoped to it.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://studio.staging.grundtone.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.production
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker logout ghcr.io
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans --force-recreate
            docker image prune -f

      - name: Smoke test
        # healthz alone let the v0.2.6 SSR regression through (API healthy,
        # pages 500) — page routes are part of the smoke since 2026-07-29.
        run: |
          BASE=https://studio.staging.grundtone.com
          for i in $(seq 1 30); do
            if curl -sf "$BASE/api/healthz" > /dev/null; then
              echo "✓ staging healthz responding"
              break
            fi
            [ "$i" = 30 ] && { echo "✗ healthz timed out"; exit 1; }
            echo "waiting ($i/30)…"
            sleep 5
          done
          for path in /login /signup /dashboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            if [ "$code" != "200" ]; then
              echo "✗ $path returned $code"
              exit 1
            fi
            echo "✓ $path 200"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # Production deploy — only on semver tags pushed to main.
  # NOTE: the `production` Environment has NO required-reviewer gate — that
  # protection rule needs GitHub Enterprise (verified by [infra] 2026-07-29;
  # our Team plan 422s on the attempt). The human gate is therefore the TAG
  # PUSH itself: pushing vX.Y.Z IS the deploy authorisation. Who may push
  # v-tags is an Allan-level decision — do not cut tags without it.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read → jobbets GITHUB_TOKEN kan pulle imaget fra ghcr; VM'en
    # logger ind med det ephemeralt i deploy-scriptet og logger ud igen, så
    # ingen langlivede registry-tokens ligger på serveren.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://studio.grundtone.com

    steps:
      - name: Snapshot before deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            cp .env.production .env.production.bak.$(date +%Y%m%d-%H%M%S)

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          # set -e er den reelle fail-fast-gate: appleboy v1 ignorerer
          # script_stop, så uden den bliver et fejlet pull et grønt no-op-
          # deploy (v0.1.6, #121).
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.production
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker logout ghcr.io
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans --force-recreate
            docker image prune -f

      - name: Smoke test
        # healthz alone let the v0.2.6 SSR regression through (API healthy,
        # pages 500) — page routes are part of the smoke since 2026-07-29.
        run: |
          BASE=https://studio.grundtone.com
          for i in $(seq 1 30); do
            if curl -sf "$BASE/api/healthz" > /dev/null; then
              echo "✓ production healthz responding"
              break
            fi
            [ "$i" = 30 ] && { echo "✗ healthz timed out — investigate manually"; exit 1; }
            echo "waiting ($i/30)…"
            sleep 5
          done
          for path in /login /signup /dashboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            if [ "$code" != "200" ]; then
              echo "✗ $path returned $code — investigate manually"
              exit 1
            fi
            echo "✓ $path 200"
          done

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Production deploy ${{ needs.build.outputs.tag }}: $STATUS"
          # TODO Phase F: post to Slack/Discord webhook from secrets
