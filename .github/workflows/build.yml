name: Build and deploy

on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  # 🔴 PR-triggeren findes, fordi image-buildet ellers KUN kan fejle EFTER
  # merge. 10.-11./8 var `main` uroerlig i fire runs, mens hver eneste PR var
  # groen: CI-workflowets `Build` (= `pnpm build`) gik igennem, mens image-
  # buildet doede paa deref-trinnet. Et bevis der foerst opstaar efter merge,
  # er ikke en barriere.
  #
  # Jobbet koerer paa ALLE PR'er og konkluderer altid under samme navn — det
  # er forudsaetningen for at kunne goeres required. Sti-filtreringen sidder
  # paa TRINNENE (se `gate` nedenfor), ALDRIG paa jobbet: et job med et falsk
  # `jobs.<id>.if:` bliver `skipped`, og en sprunget required check BLOKERER
  # TAVST i stedet for at melde groent ([infra], maalt 2026-08-11: 26 groenne
  # checks og en PR i BLOCKED uden forklaring).
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Cancel earlier runs of the same ref so the latest commit wins; never cancel
# tag deploys, those must always complete or fail loudly.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build the studio image and push to GHCR. Tags include sha + branch +
  # semver-on-tags so deploys can pin to a specific image.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    # 🔴 Navnet er ikke kosmetik. Checket hed indtil nu `build`, og CI-workflowets
    # helt andet job hed `Build` (= `pnpm build`). De to adskilte sig ved ét
    # bogstav og maalte forskellige ting: `pnpm build` gik igennem, mens
    # image-buildet doede paa deref-trinnet.
    #
    # Den 10.-11./8 var `main` uroerlig i fire runs uden at nogen saa det —
    # required-listen viste `Build` groen, og det blev laest som "buildet er
    # daekket". Navnet gjorde hullet usynligt.
    #
    # `name:` aendrer KUN det viste check-kontekst; `needs: build` nedenfor
    # peger paa job-ID'et og er uroert.
    name: image build + boot-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless cosign: OIDC-tokenet ER identiteten i signaturen. Verifikation
      # binder til dette workflows sti (build.yml) — IKKE release.yml.
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v7
        with:
          # 🔴 Ikke valgfri. Default-dybden er 1, og saa findes PR'ens base-sha
          # ikke i klonen — `git diff` i gate-trinnet ville fejle eller give et
          # misvisende svar. En gate der ikke kan se, maa ikke gaette.
          fetch-depth: 0

      # ── Sti-gate ────────────────────────────────────────────────────────
      # ÉT gate-trin med ét output, frem for `if:` paa hvert dyrt trin. Med
      # betingelsen gentaget koerer det fjerde trin nogen tilfoejer uden den
      # altid — og DEN fejl ytrer sig kun som ekstra minutter, aldrig som en
      # fejl. Derfor ét sted at rette ([infra]).
      #
      # `git diff` frem for en paths-filter-action: fem linjer shell vi kan
      # laese vejer tungere end en tredjeparts-action mere i supply-chain'en.
      - id: gate
        name: rører ændringen build-input?
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'push/tag — bygger altid'
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          # Fejler mod at BYGGE, ikke mod at springe over. En gate der falder
          # til "spring over", forsvinder tavst den dag konteksten aendrer sig.
          if [ -z "$base" ]; then
            echo '::notice::kunne ikke afgøre base-sha — bygger for en sikkerheds skyld'
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hvad gaten daekker: input der kan braekke IMAGE-buildet eller
          # BOOTEN. Ikke "hvad aendrer imaget" — Dockerfilens `COPY . .` goer
          # teknisk set hele repoet til build-input, og en gate paa alt gater
          # ingenting. En .vue-aendring kan braekke `pnpm build`, og DEN er
          # daekket af CI-workflowets egne checks.
          #
          # package.json i ENHVER dybde: #207, som braekkede main, aendrede
          # apps/studio/package.json (fanget af lockfilen — men et moenster der
          # kun kender rod-package.json daekker ikke en workspace-pakke).
          #
          # docker/, turbo.json og .npmrc er med, fordi Dockerfilen COPY'er dem
          # (linje 21 og 105) — [cursor] fandt hullet: entrypointet koerer
          # migrationer FOER serveren starter, saa boot-smoken afhaenger direkte
          # af det, og en aendring dér ville ellers slippe forbi ubygget.
          #
          # build.yml og boot-smoke.sh selv er med, saa aendringer i selve
          # byggedefinitionen og i kontrollen ogsaa proeves.
          PATTERN='^(pnpm-lock\.yaml|pnpm-workspace\.yaml|Dockerfile|\.dockerignore|turbo\.json|\.npmrc|docker/.*|\.github/workflows/build\.yml|scripts/boot-smoke\.sh|(.*/)?package\.json)$'
          # 🔴 Eksplicit status frem for at lade `bash -e` afgoere det. Maalt:
          # en fejlende `git diff` i en kommando-substitution afbryder trinnet
          # (exit 129) og goer jobbet ROEDT. Det er fail-CLOSED, ikke fail-open
          # mod at bygge — en forbigaaende git-fejl ville blokere en PR paa
          # noget uvedkommende. Kan vi ikke se, BYGGER vi. ([cursor]s mekanisme
          # var en anden — den paastod tavs `relevant=false` — men bekymringen
          # er rigtig.)
          if ! CHANGED=$(git diff --name-only "$base"...HEAD); then
            echo '::notice::git diff fejlede — bygger for en sikkerheds skyld'
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ændrede filer: $(echo "$CHANGED" | wc -l | tr -d ' ')"
          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            echo 'build-input rørt → bygger:'
            echo "$CHANGED" | grep -E "$PATTERN" | sed 's/^/  /'
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ingen build-input rørt → springer build + smoke over'
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi

      # Samme gate-output som de dyre trin: paa en PR uden build-input er der
      # intet at bygge og intet at logge ind for. Uden `if:` her ville
      # "spring over"-grenen stadig koste buildx-opsaetning + registry-login,
      # og saa er besparelsen kun halv.
      - uses: docker/setup-buildx-action@v4
        if: steps.gate.outputs.relevant == 'true'

      - name: Log in to ghcr.io
        if: steps.gate.outputs.relevant == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Pick the canonical deploy tag
        id: tag
        # Tag pushes deploy the semver tag (X.Y.Z); branch pushes use the
        # short SHA so each commit is independently rollback-able.
        # OBS: vi STRIPPER 'v'-prefiks fra ref_name fordi docker/metadata-action
        # publisher imaget som '0.1.3', ikke 'v0.1.3' (default semver-pattern).
        # Hvis vi ikke stripper, fejler deploy-job med "manifest unknown".
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            REF="${{ github.ref_name }}"
            echo "value=${REF#v}" >> "$GITHUB_OUTPUT"
          else
            # 🔴 `github.sha` er MERGE-commit'en paa et pull_request-event, ikke
            # PR'ens head. Linjen var korrekt saa laenge workflowet kun blev
            # trigget af push; PR-triggeren aendrer konteksten under den.
            # En aendring der goer en hidtil korrekt linje forkert, staar ikke
            # i diffen — der er intet nyt paa linjen at reviewe.
            SHA='${{ github.event.pull_request.head.sha || github.sha }}'
            echo "value=sha-$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # ── PR-sti: byg lokalt, push ALDRIG ─────────────────────────────────
      #
      # Hvad denne sti beviser, og hvad den ikke gør:
      #
      #   **PR-stien beviser at det kan bygge og boote — ikke hvad der udleveres.**
      #
      # Publiceringen, digest-pinnet og attestationerne hoerer til push-stien
      # nedenfor. Laeses en groen PR-check som en deploy-garanti, er den laest
      # som svar paa et andet spoergsmaal end det, den stillede.
      #
      # 🔴 `provenance: false` + `sbom: false` er BÆRENDE her, ikke hygiejne.
      # Attestationer producerer et INDEX, og `--load` kan ikke laegge et index
      # i runnerens image-store. (En udviklermaskine med containerd image store
      # KAN — maalt 2026-08-11: et lokalt build med attestation loadede fint paa
      # OrbStack. Lokale `--load`-builds ligner altsaa ikke noedvendigvis
      # runnerens.) Slaar nogen provenance til her, fejler checket paa et build
      # der plejede at virke, med beskeden `docker exporter does not currently
      # support exporting manifest lists` — som hverken naevner attestationer
      # eller provenance.
      #
      # Unikt tag pr. run + head-sha: et efterladt tag fra et tidligere run kan
      # ikke tavst genbruges, og tagget peger paa den commit der faktisk blev
      # reviewet (github.sha ville vaere merge-commit'en).
      #
      # sentry_auth_token udelades bevidst: PR-builds skal ikke uploade
      # sourcemaps. Dockerfilen springer uploadet over uden token.
      - name: Build image for the PR (--load, ingen push)
        id: prbuild
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: studio-pr:${{ github.run_id }}-${{ github.event.pull_request.head.sha }}
          # head.sha, ikke github.sha: paa et PR-event er github.sha MERGE-
          # commit'en, og revisionen skal pege paa det der blev reviewet.
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            REVISION=${{ github.event.pull_request.head.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=studio-v2
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # 🔴 Labels EKSPLICIT, ikke kun metadata-actions defaults (beslutning
          # AJ): revision-labelet er det ene af tre ben i runtime-assertion #8
          # (healthz.revision == OCI-label == git-ref). Hviler det paa en
          # default, kan en actions-opgradering tavst droppe det ben.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.value }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.value }}
            REVISION=${{ github.sha }}
          # scope=studio-v2: frisk cache-scope indført under v0.2.11-runde 4
          # på en stale-cache-hypotese der siden blev AFKRÆFTET (rodårsagen var
          # smoke-før-push, se boot-smoke-steppet). Beholdes som harmløs
          # hygiejne; bump suffikset ved reelle stale-cache-mistanker.
          cache-from: type=gha,scope=studio-v2
          cache-to: type=gha,mode=max,scope=studio-v2
          provenance: false
          # Privat @klanghaus-pakke-adgang: Dockerfile'en mounter dette som
          # `--mount=type=secret,id=node_auth_token`. Uden det fejler pnpm install
          # med 401 på @klanghaus/auth-jwt m.fl. GITHUB_TOKEN har packages:read i
          # org (kræver at de pakker grant'er denne repo Actions-adgang).
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Boot-smoke (v0.2.11-incident, 2026-08-03): the image MUST come up and
      # answer healthz + serve a real page before any deploy job may run. The
      # v0.2.11 crashloop (Nitro dropped transitive OTel deps from the runtime
      # node_modules) booted fine locally — only the pruned image failed, so
      # only running the actual image catches this class. Dummy env: the app
      # boots without real backends; pages render SSR shells. OTel endpoint is
      # set ON so the telemetry path is exercised, not skipped.
      #
      # PLACERING + DIGEST ER BÆRENDE (v0.2.11-runde 6): steppet SKAL stå
      # EFTER push og teste den PUSHEDE DIGEST. Den oprindelige placering før
      # push testede stiltiende forrige runs registry-image (container-driveren
      # loader ikke builds i daemonen, så `docker run :main` puller) — tre
      # runder "fejlede" på v0.2.11's gamle artefakt mens de reelle builds
      # aldrig blev målt. Digest-pin = artefakten deploy-jobbene reelt puller;
      # fejler smoken, fejler jobbet, og ingen deploy sker (prod pinner
      # semver/sha-tags, aldrig :main, så et upåvist :main-tag er harmløst).
      - name: Boot-smoke the pushed image
        if: github.event_name != 'pull_request'
        run: |
          # github.repository har store bogstaver (KlangHaus/…) — docker kræver
          # lowercase repo-navne (metadata-action lowercaser selv, rå env gør ikke)
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')@${{ steps.push.outputs.digest }}"
          scripts/boot-smoke.sh "$IMAGE" > /dev/null

      # ── Signér DIGESTEN, efter boot-smoken (beslutning AJ) ───────────────
      #
      # Keyless: OIDC-identiteten (dette repo + DENNE workflow-sti, build.yml)
      # ER signaturen — der findes ingen noegle at laekke. Verifikationens
      # identitets-regexp binder til `.github/workflows/build.yml`; det er
      # forskellen fra repos der signerer i release.yml, og den er allerede
      # skrevet ind i det pinnede verifikations-regexp hos [infra].
      #
      # Vi signerer ${DIGEST}, aldrig et tag: et tag er flytbart, og en
      # signatur paa noget flytbart attesterer det forkerte objekt. Efter
      # boot-smoken med vilje — et image der ikke booter skal ikke baere en
      # signatur.
      # ── 🔴 BEVIDST ASYMMETRI: SIGNÉR med 2.5.2, VERIFICÉR med 3.0.6 ─────
      #
      # RYD IKKE OP I DEN HER. To installs ser ud som en fejl og er det ikke.
      # Begrundelsen, saa den ikke skal genopdages:
      #
      # Alle fire CVE'er i cosign 2.5.x ligger i VERIFIKATIONS-stien. En
      # opgraderet verifikator er derfor hele sikkerhedsgevinsten. En
      # opgraderet SIGNER giver nul gevinst — og koster: cosign 3.0.6 lagger
      # signaturen et andet sted (sha256-<digest> uden .sig, hvor 2.x brugte
      # sha256-<digest>.sig).
      #
      # MAALT af [auth]: cosign 2.5.2 kan IKKE verificere et 3.0.6-signeret
      # image (exit 10, "no signatures found"). Positiv kontrol: 2.5.2 laeser
      # .sig-naboen fint, og 3.0.6 laeser samme image fint — det er FORMATET,
      # ikke opsaetningen. Hvert image signeret med 3.x er derfor ulaeseligt
      # for enhver 2.x-verifikator nedstroems (VM'erne).
      #
      # Splitten er selv-begraensende: hvert efterfoelgende build signerer i
      # 2.x-format igen, saa det ene 3.x-signerede image (86602ca6…) aeldes ud
      # uden gen-signering. ([sikkerhed]s kald (ii), 2026-09-07.)
      #
      # Rakkefoelgen er ikke tilfaeldig: verifikatoren installeres SIDST, saa
      # `cosign` paa PATH er 3.0.6. Signeren kaldes ved absolut sti.
      - name: Install cosign for SIGNING (2.5.2 — bevidst gammel, se over)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: v2.5.2
          install-dir: ${{ runner.temp }}/cosign-signer
      - name: Install cosign for VERIFICATION (3.0.6)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed digest
        id: sign
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')@${{ steps.push.outputs.digest }}"
          SIGNER="${{ runner.temp }}/cosign-signer/cosign"

          # 🔴 Asymmetrien skal MAALES, ikke antages. Skifter installerens
          # default, eller vender PATH-raekkefoelgen, ville vi tavst signere
          # med 3.x igen — praecis det splitten findes for at undgaa.
          SIGNER_V=$("$SIGNER" version 2>/dev/null | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          case "$SIGNER_V" in
            v2.*|2.*) echo "  signer: cosign $SIGNER_V ✓" ;;
            *) echo "::error::signeren er cosign '$SIGNER_V', ikke 2.x — splitten er brudt og imaget ville blive ulaeseligt for 2.x-verifikatorer"; exit 1 ;;
          esac
          VERIFIER_V=$(cosign version 2>/dev/null | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          case "$VERIFIER_V" in
            v3.*|3.*) echo "  verifikator paa PATH: cosign $VERIFIER_V ✓" ;;
            *) echo "::error::verifikatoren paa PATH er cosign '$VERIFIER_V', ikke 3.x — CVE-gevinsten udebliver"; exit 1 ;;
          esac

          "$SIGNER" sign --yes "$IMAGE"
          echo "signeret: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # 🔴 En signatur er ikke et vaern — VERIFIKATIONEN med en PINNET identitet
      # er. [taktart]s fund, reproduceret paa vores EGET image (aa3bf9a):
      #   pinnet (repo+workflow-fil+tilladte refs)  exit 0
      #   andet repo                                exit 12
      #   bredt '^https://github\.com/KlangHaus/'   exit 0   ← ACCEPTERER
      # Det brede moenster fra ADR-0003 §D godkender altsaa enhver signatur fra
      # ethvert workflow i ethvert repo i orgen. Fristelsen — naar vores
      # workflow hedder build.yml og forlaegget hedder release.yml — er at
      # udvide moenstret indtil det "bare virker". Det er praecis den bevaegelse
      # der goer gaten til en formalitet.
      #
      # Identiteten er LAEST ud af signaturen, ikke gaettet. Refs: main OG
      # vX.Y.Z-tags (prod-deploys sker fra tags), men ALDRIG refs/pull/.
      #
      # Og vi koerer BEGGE retninger hver gang: uden et udfald hvor
      # verifikationen fejler, er et exit 0 foreneligt med "cosign returnerer
      # altid 0". Den negative kontrol er en del af gaten, ikke noget nogen
      # koerte en enkelt gang.
      - name: Verify the signature with a pinned identity (both directions)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.sign.outputs.image }}
          ISSUER: https://token.actions.githubusercontent.com
          PINNED: ^https://github\.com/KlangHaus/grundtone-studio/\.github/workflows/build\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$
          WRONG: ^https://github\.com/KlangHaus/grundtone-studio/\.github/workflows/release\.yml@.*$
        run: |
          set -euo pipefail
          [ -n "$IMAGE" ] || { echo "::error::intet image at verificere — signerings-steppet gav ingen output"; exit 1; }

          # stdout FANGES i stedet for at ryge i /dev/null: identiteten staar
          # i payloaden, og uden den er post-merge-beviset kun "steppet blev
          # groent". Den forventede observation er skrevet ned i PR-teksten
          # FOER foerste main-push — ellers er "det blev groent" en erindring,
          # ikke en maaling.
          if ! VERIFIED=$(cosign verify "$IMAGE" \
                --certificate-identity-regexp "$PINNED" \
                --certificate-oidc-issuer "$ISSUER"); then
            echo "::error::signaturen matcher IKKE den pinnede identitet ($PINNED)"
            exit 1
          fi
          echo "✓ signatur verificeret mod pinnet identitet"
          # MAALT paa run 34131844473: .optional.Subject/.Issuer findes IKKE i
          # cosign 3.0.6's payload — begge kom ud som "ukendt". Vi leder derfor
          # bredt og DUMPER payloaden hvis felterne ikke findes, saa linjen
          # aldrig igen paastaar at maale noget den ikke maaler.
          IDENT=$(printf '%s' "$VERIFIED" | jq -r '[.. | objects | (.Subject? // .subject?)] | map(select(type == "string")) | first // empty' 2>/dev/null || true)
          if [ -n "$IDENT" ]; then
            echo "  identitet i signaturen: $IDENT"
          else
            echo "  ⚠ kunne ikke laese identiteten ud af payloaden — feltnavnene er aendret:"
            printf '%s\n' "$VERIFIED" | head -c 1500
          fi

          # Negativ kontrol: samme image, forkert workflow-fil. Bestaar denne,
          # maaler verifikationen ingenting.
          if cosign verify "$IMAGE" \
                --certificate-identity-regexp "$WRONG" \
                --certificate-oidc-issuer "$ISSUER" > /dev/null 2>&1; then
            echo "::error::verifikationen ACCEPTEREDE en forkert identitet — gaten maaler intet"
            exit 1
          fi
          echo "✓ negativ kontrol: forkert identitet afvist"

          # Negativ kontrol nr. 2, ANDEN akse: ikke "forkert signatur", men
          # SLET INGEN. Det er den sti CVE-klassen i cosign 2.5.x fejlede
          # fail-open paa — en parse-fejl paa noget der ikke er der.
          #
          # Maalet er vores EGET signatur-artefakt: cosign gemmer signaturen
          # som et tag afledt af digest'et, og vi signerer aldrig signaturer.
          # Det er derfor et objekt i vores eget registry som deterministisk
          # er usigneret — ingen ekstern afhaengighed, ingen Docker Hub-rate-
          # limit, og ingen tvivl om hvem der ejer det.
          # 🔴 Signatur-tagget skifter format med cosign-versionen. MAALT paa
          # run 34131844473: cosign 2.x lagde signaturen paa
          # sha256-<digest>.sig, mens 3.0.6 laegger den paa sha256-<digest>
          # UDEN suffiks. Vi hardkoder derfor ingen af delene, men proever
          # begge og fejler HOEJLYDT hvis ingen findes.
          UNSIGNED=$(.github/scripts/cosign-sig-ref.sh "${IMAGE%@*}" "${IMAGE#*@}")
          echo "  signatur-artefakt (usigneret maal): $UNSIGNED"
          if OUT=$(cosign verify "$UNSIGNED" \
                --certificate-identity-regexp "$PINNED" \
                --certificate-oidc-issuer "$ISSUER" 2>&1); then
            echo "::error::verifikationen ACCEPTEREDE et image UDEN signatur"
            exit 1
          fi
          # 🔴 Et vilkaarligt exit != 0 er IKKE nok. En netvaerksfejl, et
          # manglende image eller en tastefejl i referencen ville ogsaa give
          # exit != 0 — og cellen ville bestaa paa den forkerte grund. Vi
          # kraever derfor at cosign faktisk udtalte sig om SIGNATURER.
          if ! printf '%s' "$OUT" | grep -qiE 'no (matching )?signatures|signature not found'; then
            echo "::error::verify fejlede, men ikke fordi signaturen manglede — cellen maaler noget andet end den paastaar:"
            printf '%s\n' "$OUT"
            exit 1
          fi
          echo "✓ negativ kontrol: image UDEN signatur afvist"

      # ── PR-sti: bevis at cosign-BINAEREN fejler LUKKET ───────────────────
      #
      # Signerings- og verifikationstrinnene ovenfor er PR-udelukkede, og det
      # er korrekt: keyless binder identiteten til OIDC-tokenet, og en PR's
      # token er refs/pull/N/merge — som det pinnede regexp med vilje afviser.
      # Man KAN ikke signere PR-image't med main-identiteten.
      #
      # Men uden dette trin ville et cosign-bump foerst bevises ved foerste
      # push til main EFTER merge, og et skipped trin taeller som opfyldt hos
      # GitHub. Denne fils egen doktrin, tolv linjer over triggeren, siger at
      # et bevis der foerst opstaar efter merge ikke er en barriere. Saa her
      # bevises det ene der KAN bevises paa en PR: at binaeren fejler LUKKET
      # naar der intet er at verificere. Det daekker ikke signerings-stien.
      - name: Install cosign (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign fails closed on an unsigned reference (PR)
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant == 'true'
        env:
          ISSUER: https://token.actions.githubusercontent.com
          PINNED: ^https://github\.com/KlangHaus/grundtone-studio/\.github/workflows/build\.yml@refs/(heads/main|tags/v[0-9]+\.[0-9]+\.[0-9]+)$
        run: |
          set -euo pipefail
          NAME="${REGISTRY}/$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          # Samme maal-konstruktion som celle 4: signatur-artefaktet for et
          # image vi HAR signeret. Vi signerer aldrig signaturer, saa det er
          # deterministisk usigneret — i vores eget registry, uden Docker
          # Hub-rate-limit. Her tages det fra :latest, fordi PR'en ikke selv
          # pusher noget.
          DIGEST=$(docker buildx imagetools inspect "$NAME:latest" --format '{{.Manifest.Digest}}') || {
            echo "::error::kunne ikke slaa $NAME:latest op — cellen kan ikke maale noget, og et tavst spring ville se ud som success"
            exit 1
          }
          # Samme to-kandidat-probe som celle 4: signatur-tagget skifter format
          # med cosign-versionen (2.x: sha256-<digest>.sig · 3.0.6:
          # sha256-<digest> uden suffiks). Hardkoder vi ét af dem, fejler
          # cellen naar formatet skifter — praecis som den gjorde paa
          # run 34131844473.
          UNSIGNED=$(.github/scripts/cosign-sig-ref.sh "$NAME" "$DIGEST")
          echo "  signatur-artefakt (usigneret maal): $UNSIGNED"

          if OUT=$(cosign verify "$UNSIGNED" \
                --certificate-identity-regexp "$PINNED" \
                --certificate-oidc-issuer "$ISSUER" 2>&1); then
            echo "::error::cosign ACCEPTEREDE en reference uden signatur — binaeren fejler AABEN"
            exit 1
          fi
          # Samme krav som celle 4: et vilkaarligt exit != 0 er ikke nok. En
          # netvaerksfejl ville ogsaa "bestaa" cellen, og en negativ kontrol
          # der er groen fordi instrumentet er i stykker, maaler ingenting.
          if ! printf '%s' "$OUT" | grep -qiE 'no (matching )?signatures|signature not found'; then
            echo "::error::verify fejlede, men ikke fordi signaturen manglede — cellen maaler noget andet end den paastaar:"
            printf '%s\n' "$OUT"
            exit 1
          fi
          echo "✓ cosign $(cosign version --json 2>/dev/null | grep -oE '\"gitVersion\": *\"[^\"]+' | cut -d'"' -f4 || echo '?') fejler lukket paa en usigneret reference"

      # ── PR-sti: smoken skal binde sig til DET image vi lige byggede ──────
      #
      # 🔴 Assertionen er ikke pedanteri. `docker/setup-buildx-action` saetter
      # `docker-container`-driveren, hvor et build IKKE havner i daemonen uden
      # `--load` — adfaerden afhaenger altsaa af en linje et helt andet sted i
      # filen. Runde 6 af v0.2.11-incidenten var praecis den fejl: tre runder
      # "fejlede" paa forrige runs artefakt.
      #
      # `docker image inspect` ALENE beviser kun at *et* image med det navn
      # findes — den ville ogsaa vaere groen paa et efterladt tag. Det unikke
      # tag pr. run fjerner den tvetydighed. De to er et PAR; hver for sig er
      # de svagere end de ser ud ([infra]).
      #
      # Og ID-sammenligningen er forskellen paa "et image blev bygget og en
      # smoke bestod" og "smoken bestod paa DET image".
      - name: Boot-smoke the PR image
        if: github.event_name == 'pull_request' && steps.gate.outputs.relevant == 'true'
        run: |
          TAG='studio-pr:${{ github.run_id }}-${{ github.event.pull_request.head.sha }}'
          built=$(docker image inspect -f '{{.Id}}' "$TAG") || {
            echo "::error::$TAG ligger ikke i daemonen — kom --load ikke igennem?"; exit 1; }
          ran=$(scripts/boot-smoke.sh "$TAG")
          if [ "$built" != "$ran" ]; then
            echo "::error::smoken kørte et andet image end det byggede (byggede $built, kørte $ran)"
            exit 1
          fi
          echo "✓ smoken kørte det image der blev bygget ($built)"

  # ─────────────────────────────────────────────────────────────────────────
  # Auto-deploy to staging on every successful develop build.
  # Uses GitHub Environment `staging` — keep secrets scoped to it.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://studio.staging.grundtone.com

    steps:
      # 🔴 Compose-filen SKAL synkroniseres ved hvert deploy. Indtil 2026-08-19
      # kørte deploy-scriptet `compose -f docker-compose.production.yml` mod den
      # fil der TILFÆLDIGVIS lå på VM'en — en håndplaceret kopi fra før #147.
      # Konsekvens: healthcheck-rettelsen (#147, juli) var "bygget" i seks uger
      # uden nogensinde at være "installeret"; prod-containeren stod unhealthy
      # hele tiden ([infra], #222). Repoet er kilden, VM'en er et mål.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docker-compose.production.yml
            Caddyfile
          sparse-checkout-cone-mode: false

      - name: Sync compose + Caddyfile to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: docker-compose.production.yml,Caddyfile
          target: ~/grundtone-studio
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # 🔴 sed der matcher INGEN linje er et stille no-op: IMAGE_TAG-linjen
            # bliver ikke skrevet, og compose faldt (med det gamle `:-latest`)
            # tilbage til et forældet image (AJ-opgave 3). Assertér at linjen
            # FINDES bagefter med den værdi vi ville skrive.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.production
            grep -qx "IMAGE_TAG=${IMAGE_TAG}" .env.production \
              || { echo "::error::.env.production bærer ikke IMAGE_TAG=${IMAGE_TAG} efter sed — linjen mangler"; exit 1; }
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker logout ghcr.io
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans --force-recreate
            docker image prune -f

      - name: Smoke test
        # healthz alone let the v0.2.6 SSR regression through (API healthy,
        # pages 500) — page routes are part of the smoke since 2026-07-29.
        run: |
          BASE=https://studio.staging.grundtone.com
          for i in $(seq 1 30); do
            if curl -sf "$BASE/api/healthz" > /dev/null; then
              echo "✓ staging healthz responding"
              break
            fi
            [ "$i" = 30 ] && { echo "✗ healthz timed out"; exit 1; }
            echo "waiting ($i/30)…"
            sleep 5
          done

          # 🔴 Svaret LAESES, ikke bare hentes. Foer denne assertion kastede
          # smoken bodyen vaek (`> /dev/null`) og beviste kun, at endpointet
          # SVAREDE — et image der regredierede til revision:"unknown" ville
          # have bestaaet. Handlerens egen kommentar sagde det: feltet er det
          # ene ben, dommeren manglede.
          #
          # Maales paa den OFFENTLIGE vhost, ikke over localhost: en Caddy der
          # svarer fra en foraeldet upstream er praecis det, dette fanger.
          ./.github/scripts/assert-served-revision.sh "$BASE" "$GITHUB_SHA"

          for path in /login /signup /dashboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            if [ "$code" != "200" ]; then
              echo "✗ $path returned $code"
              exit 1
            fi
            echo "✓ $path 200"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # Production deploy — only on semver tags pushed to main.
  # NOTE: the `production` Environment has NO required-reviewer gate — that
  # protection rule needs GitHub Enterprise (verified by [infra] 2026-07-29;
  # our Team plan 422s on the attempt). The human gate is therefore the TAG
  # PUSH itself: pushing vX.Y.Z IS the deploy authorisation. Who may push
  # v-tags is an Allan-level decision — do not cut tags without it.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # packages: read → jobbets GITHUB_TOKEN kan pulle imaget fra ghcr; VM'en
    # logger ind med det ephemeralt i deploy-scriptet og logger ud igen, så
    # ingen langlivede registry-tokens ligger på serveren.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://studio.grundtone.com

    steps:
      - name: Snapshot before deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            cp .env.production .env.production.bak.$(date +%Y%m%d-%H%M%S)

      # 🔴 Compose-filen SKAL synkroniseres ved hvert deploy. Indtil 2026-08-19
      # kørte deploy-scriptet `compose -f docker-compose.production.yml` mod den
      # fil der TILFÆLDIGVIS lå på VM'en — en håndplaceret kopi fra før #147.
      # Konsekvens: healthcheck-rettelsen (#147, juli) var "bygget" i seks uger
      # uden nogensinde at være "installeret"; prod-containeren stod unhealthy
      # hele tiden ([infra], #222). Repoet er kilden, VM'en er et mål.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docker-compose.production.yml
            Caddyfile
          sparse-checkout-cone-mode: false

      - name: Sync compose + Caddyfile to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.production.yml,Caddyfile
          target: ~/grundtone-studio
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          # set -e er den reelle fail-fast-gate: appleboy v1 ignorerer
          # script_stop, så uden den bliver et fejlet pull et grønt no-op-
          # deploy (v0.1.6, #121).
          script: |
            set -euo pipefail
            cd ~/grundtone-studio
            export IMAGE_TAG=${{ needs.build.outputs.tag }}
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # 🔴 sed der matcher INGEN linje er et stille no-op: IMAGE_TAG-linjen
            # bliver ikke skrevet, og compose faldt (med det gamle `:-latest`)
            # tilbage til et forældet image (AJ-opgave 3). Assertér at linjen
            # FINDES bagefter med den værdi vi ville skrive.
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.production
            grep -qx "IMAGE_TAG=${IMAGE_TAG}" .env.production \
              || { echo "::error::.env.production bærer ikke IMAGE_TAG=${IMAGE_TAG} efter sed — linjen mangler"; exit 1; }
            docker compose --env-file .env.production -f docker-compose.production.yml pull
            docker logout ghcr.io
            docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans --force-recreate
            docker image prune -f

      - name: Smoke test
        # healthz alone let the v0.2.6 SSR regression through (API healthy,
        # pages 500) — page routes are part of the smoke since 2026-07-29.
        run: |
          BASE=https://studio.grundtone.com
          for i in $(seq 1 30); do
            if curl -sf "$BASE/api/healthz" > /dev/null; then
              echo "✓ production healthz responding"
              break
            fi
            [ "$i" = 30 ] && { echo "✗ healthz timed out — investigate manually"; exit 1; }
            echo "waiting ($i/30)…"
            sleep 5
          done

          # 🔴 Svaret LAESES, ikke bare hentes. Foer denne assertion kastede
          # smoken bodyen vaek (`> /dev/null`) og beviste kun, at endpointet
          # SVAREDE — et image der regredierede til revision:"unknown" ville
          # have bestaaet. Handlerens egen kommentar sagde det: feltet er det
          # ene ben, dommeren manglede.
          #
          # Maales paa den OFFENTLIGE vhost, ikke over localhost: en Caddy der
          # svarer fra en foraeldet upstream er praecis det, dette fanger.
          ./.github/scripts/assert-served-revision.sh "$BASE" "$GITHUB_SHA"

          for path in /login /signup /dashboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            if [ "$code" != "200" ]; then
              echo "✗ $path returned $code — investigate manually"
              exit 1
            fi
            echo "✓ $path 200"
          done

          # 🔴 Regionen i DSN'en er JURIDISK bærende: privatlivspolitikkens
          # §2.5 og §6 siger "Sentry, EU-region", og det er sandt PRÆCIS fordi
          # DSN'en peger på ingest.de.sentry.io. Regionen bor i en env-var, så
          # et projekt-/regionsskifte gør to publicerede sætninger falske uden
          # at teksten er rørt ([infra]-fund 2026-08-19, [jura] bekræftede at
          # teksten er korrekt i dag). En unit-test ville måle CI's env — her
          # måles den værdi der FAKTISK serveres til brugerne.
          # 🔴 FORANKRET, ikke en substring-søgning ([review]-fund): et løst
          # grep paa 'ingest.de.sentry.io' accepterer ogsaa
          # evil.ingest.de.sentry.io.attacker.example, fordi substrengen findes
          # et sted. Moenstret skal matche SAMME form som EU_INGEST-regexen i
          # server/lib/sentry-region.test.ts — ellers er de to haandhaevelser
          # ikke samme regel, og enhedstesten vogter kun det ene sted.
          dsn=$(curl -s "$BASE/" | grep -o 'sentryDsn:"[^"]*"' | head -1)
          if [ -n "$dsn" ] && ! printf '%s' "$dsn" \
            | grep -qE '^sentryDsn:"https://[^@"]+@[^.")]+\.ingest\.de\.sentry\.io/'; then
            echo "::error::Serveret sentryDsn peger IKKE på EU-ingest. Privatlivspolitikkens §2.5 og §6 siger 'Sentry, EU-region' — flyt DSN'en tilbage, eller ret begge tekster med [jura]."
            exit 1
          fi
          [ -n "$dsn" ] && echo "✓ serveret Sentry-DSN er EU-ingest (§2.5 holder)"

      - name: Notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Production deploy ${{ needs.build.outputs.tag }}: $STATUS"
          # TODO Phase F: post to Slack/Discord webhook from secrets
