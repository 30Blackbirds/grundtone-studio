name: SDK release

# Owns the @grundtone/saas-client release lifecycle:
#   1. On main pushes with pending changesets → open / refresh a "Version
#      Packages" PR that bumps version + writes changelog.
#   2. When that PR merges (no pending changesets remain) → build the SDK
#      bundles, upload to Bunny.net at versioned + major-alias paths, and
#      tag the release.

on:
  push:
    branches: [main]

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # Privat @klanghaus-pakke-adgang (permissions-client via npm.pkg.github.com)
      packages: read

    # .npmrc auth'er @klanghaus-scope med ${NODE_AUTH_TOKEN}. Manglede her —
    # latent 401 i install-steppet, maskeret af warm pnpm-cache indtil
    # lockfile-ændringen i #181 bustede cache-nøglen. Job-niveau så både
    # install, build og changesets-publish er dækket.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK bundles
        run: pnpm --filter @grundtone/saas-client build

      # changesets/action either opens a "Version Packages" PR (if there are
      # pending changesets) or returns published: true once the bump PR merges.
      - name: Version or publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1.9.0 (var en GREN, ikke et tag)
        with:
          version: pnpm changeset version
          publish: pnpm release:sdk
          commit: 'chore(deps): version SDK packages'
          title: 'chore(deps): version SDK packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SDK bundles to Bunny.net
        if: steps.changesets.outputs.published == 'true'
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: bash scripts/upload-sdk-to-bunny.sh
