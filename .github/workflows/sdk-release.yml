name: SDK release

# Owns the @grundtone/saas-client release lifecycle:
#   1. On main pushes with pending changesets → open / refresh a "Version
#      Packages" PR that bumps version + writes changelog.
#   2. When that PR merges (no pending changesets remain) → build the SDK
#      bundles and tag the release.
#
# The bundles are NOT uploaded anywhere from here. The studio image serves them
# at /client/v1.js and /client/v1.0.0.js (Dockerfile + routes/client/[file]),
# and the CDN pull zone uses studio as its origin, so a studio deploy is what
# publishes a new SDK build (KH-988).

on:
  push:
    branches: [main]

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      pull-requests: write
    # No packages: read, no NODE_AUTH_TOKEN and no id-token: write: since #354
    # every dependency is public, and `release:sdk` publishes nothing to a
    # registry (saas-client is private; it builds and tags), so nothing here
    # consumes an OIDC token ([sikkerhed], #360 verdict).

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK bundles
        run: pnpm --filter @grundtone/saas-client build

      # changesets/action either opens a "Version Packages" PR (if there are
      # pending changesets) or returns published: true once the bump PR merges.
      - name: Version or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0 (var en GREN, ikke et tag)
        with:
          version: pnpm changeset version
          publish: pnpm release:sdk
          commit: 'chore(deps): version SDK packages'
          title: 'chore(deps): version SDK packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
