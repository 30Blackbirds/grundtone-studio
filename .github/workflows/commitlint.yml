name: Commit lint

# Runs commitlint against the PR title (which becomes the squash-merge subject
# on `main`) and every commit on the PR branch. The pre-commit hook handles
# local commits; this catches contributors without the hook installed.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install root devDependencies only
        run: pnpm install --frozen-lockfile --ignore-scripts --filter grundtone-studio-monorepo

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint

      - name: Lint commits in PR
        run: |
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
