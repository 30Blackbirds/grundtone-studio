name: OSSF Scorecard

# OSSF Scorecard er et OFFENTLIGT-repo-værktøj: på private repos kan default
# GITHUB_TOKEN ikke GraphQL-query'e commits ("Resource not accessible by
# integration"), og `upload-sarif` 403'er fordi GHAS/Code Security er slået fra
# på private repos (cost — SonarQube + gitleaks er posturen; se GITHUB-RULES.md
# "GHAS"). Kørt som public-skabelon på et privat repo fejlede den derfor på hver
# push til main OG smittede code-scanning med en repo-wide "CodeQL configuration
# error" (studio-issue #71).
#
# Fix: hele jobbet self-gater på repo-visibility. På PRIVATE repos skippes det
# rent (alle triggers → ingen fejl, ingen SARIF-upload). Bliver studio nogensinde
# public, aktiverer det automatisk med den korrekte public-config nedenfor
# (publish_results + upload-sarif virker på public uden PAT). Intet at pille ved.

on:
  schedule:
    - cron: '33 2 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Kun på offentlige repos — se header. På private (studio i dag) skippes det.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14

      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
