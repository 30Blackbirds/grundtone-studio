name: Bug report
description: Something in Grundtone Studio does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that triggers it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA. `/api/healthz` reports the running version.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Studio?
      options:
        - Self-hosted (Docker)
        - Local development
        - Hosted service
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, tokens and personal data before pasting.
      render: shell
