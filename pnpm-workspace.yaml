packages:
  - apps/*
  - packages/*

# Force-bump transitive deps that have a high-severity advisory the upstream
# owner hasn't picked up yet. Each override needs a justification line — re-
# evaluate periodically and remove once the natural tree resolves to the same
# or newer version.
#
# Note: migrated here from package.json's pnpm.overrides because pnpm 10
# ignores that field (warns: "no longer read by pnpm").
overrides:
  # Advisory floors (riff actj21jzq6b9kdkhylgfogvs, 2026-09-14). The selectors
  # match only the vulnerable range, so other majors are left alone; remove
  # once upstream ranges resolve past them on their own.
  #   svgo    GHSA-w27v-7q3p-w38r (high), GHSA-4vpr-x523-8j87 — raised in place on the existing `svgo` key below
  #   js-yaml GHSA-2883-xcg3-v3hh (high)
  #   colord  GHSA-2wm5-q62r-hmrv
  js-yaml@<3.15.2: ^3.15.2
  colord@<2.9.4: ^2.9.4
  # 🔴 Dedupliker vue til ÉN version. Ikke kosmetik: Nitro skriver
  # multi-versions-pakker som symlinks ind i .output/server/node_modules/.nitro/,
  # og med to vue'er opstaar der en RING (vue <-> @vue/server-renderer). Docker-
  # buildets `cp -RL` foelger symlinks og fejler paa den ("Symbolic link loop"),
  # saa image-buildet doer EFTER at `pnpm build` er gaaet igennem.
  #
  # Splittet kom med #207's nuxt-bump (3.21.7 -> 3.21.10): nuxt kraever
  # vue ^3.5.40, mens lockfilen holdt 3.5.38 i @grundtone-undertraeet.
  # Ingen af siderne kraever 3.5.38 — @grundtone/vue accepterer ^3.5.13 — saa
  # der er intet at give koeb paa her; det var en efterladt oploesning.
  #
  # `-L` er IKKE en kopieringsdetalje, den er garantien: verifikationstrinnet
  # under kraever et 100% symlink-frit .output, fordi runtime-imaget ikke har
  # det filsystem, linkene peger ind i. Derfor fjernes RINGEN, ikke `-L`.
  vue: ^3.5.41
  # GHSA-77vg-94rm-hx3p — DoS via sparse-array deserialization in 5.6.3–5.8.0.
  # Pulled in by @nuxtjs/i18n; remove when that package bumps.
  #
  # 🔴 RAISED 2026-10-08 from ^5.8.1 to ^5.9.3. Three newer advisories —
  # GHSA-j22f-vq7h-c4qm, GHSA-mcm9-63f2-9j32, GHSA-x5rw-q4pp-hg5g (high) — are
  # all patched in 5.9.3, and the old floor was resolving 5.8.1, i.e. exactly
  # the version it had been raised to. Same stale-floor class as shell-quote
  # above. Also now reached via @sentry/nuxt > nuxt > devalue, not only i18n.
  devalue: ^5.9.3
  # GHSA-w7jw-789q-3m8p — critical: shell-quote quote() does not escape
  # newlines in object .op values (patched 1.8.4). Plus a later quadratic-
  # complexity DoS in parse() patched in 1.9.0 — floor raised to cover both.
  # Pulled in by @nuxt/devtools > launch-editor (transitive through
  # @sentry/nuxt > nuxt).
  #
  # 🔴 RAISED 2026-10-08 from ^1.9.0 to ^1.11.0. GHSA-pqg4-j6r4-53mv (critical)
  # is patched in 1.11.0, and the old floor happily resolved 1.10.0 — which is
  # inside the new advisory's range. Same failure as the fast-uri note below:
  # a floor written against one advisory is not a guard against the next, and
  # this one had been standing green while the tree was vulnerable. Measured:
  # `pnpm audit --prod` reported shell-quote 1.10.0 critical on 2026-10-08.
  # Bounded to 1.x by the caret, deliberately.
  shell-quote: ^1.11.0
  # 🔴 NO OVERRIDE FOR simple-git — TRIED 2026-10-08 AND IT BREAKS THE BUILD.
  # GHSA-x6jw-m9v5-85vh (critical), GHSA-v5rq-49vh-5v5c (critical, in
  # @simple-git/argv-parser) and GHSA-g4wm-2vf7-vfgr + GHSA-858h-whjf-mvg5
  # (high) all need simple-git >=4.0.1, reached via
  # @sentry/nuxt > nuxt > @nuxt/devtools > simple-git.
  #
  # `simple-git: '>=4.0.1 <5'` resolves cleanly (4.0.2, and argv-parser lands
  # on 2.0.1 by itself) and then FAILS AT INSTALL TIME:
  #
  #   ERROR  The requested module 'simple-git' does not provide an export
  #          named 'default'
  #
  # simple-git 4 dropped the default export; @nuxt/devtools imports it. The
  # failure is in apps/studio's postinstall (`nuxt prepare`), so it is not
  # confined to the devtools panel in dev as I first assumed when writing this
  # override — prepare runs on every install and in CI. Confirmed by reverting
  # this one line while keeping the others: install goes green again.
  #
  # There is no upstream cure either: measured against the registry, every
  # published @nuxt/devtools up to 3.4.2 declares `simple-git: ^3.36.0`. That is
  # also why Dependabot's four security-update runs for this chain fail instead
  # of opening PRs.
  #
  # So these two criticals are NOT an override problem. The real defect is that
  # dev tooling sits in the --prod closure at all: `nuxt` declares @nuxt/devtools
  # as a regular dependency, and nuxt arrives through @sentry/nuxt. Routes, none
  # of which is a one-line fix: a nuxt/devtools release that moves to simple-git
  # 4, a patchedDependencies patch against 3.36.0, or a documented
  # `pnpm audit --ignore` for the devtools chain. Tracked, not silently dropped.
  # GHSA-jp82-f5mq-hwhp — high: seroval unbounded string length in JSON
  # deserialization; patched in 1.6.3. Pulled in via
  # @sentry/nuxt > nuxt > @nuxt/vite-builder > seroval. Bounded to 1.x.
  seroval: '>=1.6.3 <2'
  # GHSA — critical node-tar decompression/parse DoS (unlimited input) plus a
  # high infinite-loop on negative entry size; both patched in 7.5.19. Pulled
  # in via @sentry/nuxt > nuxt > nitropack > @vercel/nft > @mapbox/node-pre-gyp.
  # (+ opfølger patched 7.5.21 — decompression-DoS-fixet i 7.5.19/20 var
  # utilstrækkeligt; gulvet hævet så prod-audit-gaten forbliver grøn.)
  tar: '>=7.5.21'
  # GHSA — high: js-yaml quadratic/exponential parse-time DoS. The old merge-key
  # advisory was patched in 4.3.0; a newer exponential-parse-time-in-flow-
  # collections advisory (vuln 5.0.0–5.2.1) is patched in 5.2.2.
  # RANGE-SCOPED, ikke blanket: read-yaml-file@1.x (changesets-kæden) deklarerer
  # js-yaml ^3 og kalder safeLoad, som er FJERNET i v4+ — den blanke '>=5.2.2'
  # knækkede release-workflowets changesets-publish med "yaml.safeLoad is not a
  # function" (samme brud som grundtone#113; 3.x er ikke i advisory-spannene).
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0'
  # brace-expansion — TO advisories, og begge har PER-LINJE-intervaller:
  #   GHSA-mh99-v99m-4gvg (CVE-2026-14257): <1.1.17 / 2.x<2.1.3 / 3.x<3.0.3 / 4.x-5.x<5.0.8
  #   GHSA-rgw5-rvv9-x895 (omgår ovenstående): <1.1.18 / 2.x<2.1.4 / 3.x<3.0.6 / 4.x-5.x<5.0.9
  #
  # RETTET 2026-08-05: den tidligere form var ÉT fladt span, >=2.0.0 <5.0.9,
  # skrevet ud fra en kommentar der påstod at advisoriet ramte "every version
  # <=5.0.7 across all major lines and patches only in 5.0.8". Det er forkert —
  # verificeret mod GitHubs advisory-API, ikke mod vores egen note. Hver
  # major-linje har sin egen patch.
  #
  # Konsekvensen af det flade span var ikke teoretisk: det ville have tvunget
  # fx en 2.1.4 — som ER patch-versionen for sin linje — op på 5.0.9, altså
  # over to major-grænser uden grund. Præcis det brud, 1.x-undtagelsen nedenfor
  # blev skrevet for at undgå. Per-linje-formen dækker alt uden at flytte nogen
  # pakke til en anden major.
  # 🔴 CARET, ikke >=. Selektoren (venstre side) vaelger HVEM der rammes, men
  # erstatnings-range'en er FRI: '>=1.1.18' tillader 5.x, og pnpm tager den
  # hoejeste. Maalt i isoleret probe — minimatch@3 med '>=1.1.18' fik
  # brace-expansion 5.0.9, altsaa tre majors op og praecis det brud, per-linje-
  # formen skal forhindre. Med '^1.1.18' bliver den paa 1.1.18. ([taktart] fandt
  # den; jeg havde >=-formen i to repos, hvor den bare aldrig fyrede.)
  #
  # Bemaerk at dette er MODSAT vores anden >=-erfaring: '>=5.0.8' resolverede
  # til 5.0.8 frem for 5.0.9. Samme operator, modsat udfald — dér fandtes ingen
  # hoejere version at hoppe til, her findes tre majors. Begge er sande.
  'brace-expansion@<1.1.18': '^1.1.18'
  # 🔴 2.x line raised 2026-10-08: <2.1.4 -> <2.1.6. Two further advisories,
  # GHSA-6j4f-fj2g-mc7p (patched 2.1.5) and GHSA-qhr7-859c-m2p7 (patched
  # 2.1.6), land above the old floor, so the tree sat on 2.1.4 — the exact
  # version this line had been written to reach. The per-line form below is
  # unchanged; only the 2.x interval moved.
  'brace-expansion@>=2.0.0 <2.1.6': '^2.1.6'
  'brace-expansion@>=3.0.0 <3.0.6': '^3.0.6'
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9'
  # GHSA — high (x2): Immutable.js List 32-bit trie overflow + Map/Set hash-
  # collision algorithmic-complexity DoS; both patched in 5.1.8. Pulled in via
  # @nuxtjs/i18n > @intlify/unplugin-vue-i18n > vite > sass. Remove when sass
  # drops the immutable dep or bumps it.
  immutable: '>=5.1.8'
  # svgo, pulled in via @sentry/nuxt > nuxt > cssnano > postcss-svgo
  # (build-time SVG optimization only). 4.0.2 fixed the removeScripts advisory;
  # 4.1.0 fixes GHSA-w27v-7q3p-w38r (high) and GHSA-4vpr-x523-8j87. Brings
  # css-select 6 and css-what 7 with it.
  svgo: ^4.1.0
  # GHSA — high (x4): fast-uri SSRF (malformet IPv6, gentaget hostname) og host
  # confusion (sprunget IDN-kanonisering, percent-kodet scheme). Alle fire er
  # patched i 4.1.3: GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-5jgf-p345-68v8, GHSA-jqff-g426-hqxp. Pulled in via
  # @sentry/nuxt > nuxt > vite-plugin-checker > stylelint > table > ajv, og
  # ligger i PROD-lukningen for @grundtone-studio/studio — ikke kun build-time.
  #
  # 🔴 Gulvet stod på '>=4.1.2', hævet dertil for at undslippe en TIDLIGERE
  # familie der var patched netop i 4.1.2. Da den nye familie ramte, pinnede
  # gulvet derfor nøjagtig den version det skulle undslippe. Samme mønster som
  # etude#58: et gulv skrevet mod ét advisory er ikke et værn mod det næste.
  # Derfor er det nye gulv BUNDET (<5). En ubundet floor lader resolutionen
  # drive op i en major hvor fix-gulvet ligger et andet sted — det var præcis
  # sådan grundtone endte på 4.1.2 fra en floor skrevet til 3.x-linjen.
  fast-uri: '>=4.1.3 <5'
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g — high (x2): ubegrænset
  # hukommelsesvækst (ingen cache-grænse) og uncaught crash / prototype-write
  # via untrusted browserslist-stats.json. Begge patched i 4.28.7.
  #
  # Lockfilen holdt TO versioner: 4.28.8 (ren) og 4.28.2 (sårbar) via
  # update-browserslist-db og stylehacks. Kun den sårbare blev fanget af
  # prod-audit-gaten, og et bump af den rene ville derfor ikke have hjulpet.
  browserslist: '>=4.28.7'
  # GHSA — high: PostCSS path traversal in previous-source-map auto-loading
  # (sourceMappingURL) → arbitrary .map file disclosure; patched in 8.5.18.
  # Pulled in via @nuxtjs/i18n > @intlify/unplugin-vue-i18n > vite. Stable
  # within the 8.x line.
  postcss: '>=8.5.18'
  # GHSA-gv7w-rqvm-qjhr — high: esbuild missing binary integrity verification
  # in Deno module enables RCE via NPM_CONFIG_REGISTRY; patched in 0.28.1.
  # Pulled in by @nuxtjs/i18n + nitropack + sentry chain.
  esbuild: ^0.28.1
  # GHSA-c76h-2ccp-4975 — high: undici unbounded memory consumption in WebSocket
  # permessage-deflate decompression; patched in 6.24.0. Pulled in (prod) by
  # @connectrpc/connect-node@1.7.0, which pins ^5.28.4 — its 1.x line never bumps
  # past undici 5, and connect-node 2.x needs @klanghaus/permissions-client
  # regenerated for connect/protobuf 2.x first. Studio's PDP client uses HTTP/2
  # (Node http2, not undici), so this only silences the audit path. Remove once
  # the connect stack moves to 2.x.
  undici: ^6.24.0
  'nanoid@<3.3.17': '^3.3.17'
  'undici@<6.28.0': '^6.28.0'
  'valibot@<=1.4.1': '^1.4.2'
  '@nuxt/devtools@<3.3.1': '^3.3.1'

# Named exceptions to the prod audit gate (pnpm audit --prod --audit-level=high
# in .github/workflows/ci.yml). Two advisories, and ONLY two, because neither has
# a version to move to: measured 2026-10-08 against the registry, the newest
# published braces IS 3.0.3 and the newest node-forge IS 1.4.0, both inside their
# own advisory ranges. The audit's "patched_versions: <0.0.0" says the same thing;
# the registry was checked so the claim does not rest on one encoding.
#
# 🔴 NAMED, NOT `--ignore-unfixable`. The blanket flag would also absorb the next
# unfixable advisory, including a CRITICAL one, without anyone deciding to. These
# two entries let a third advisory turn the gate red, which is the whole point of
# keeping the gate.
#
# Reachability, measured in .output/server/node_modules (the shipped Nitro
# closure, 40 top-level packages): braces, node-forge and their entire chains
# (micromatch, fast-glob, listhen) are absent — 0 occurrences each, against a
# positive control of devalue, which IS present. The directory accumulates across
# builds (it held devalue@5.8.1 and @5.9.4 side by side), and accumulation can
# only add entries, never remove them, so a zero there is a strong absence.
#
# Re-evaluate when either package publishes a fix, or when the dependency path
# changes. Both are build/dev-time only today; if either ever enters the server
# bundle, delete its line here and treat it as a live finding.
auditConfig:
  ignoreGhsas:
    # 🔴 THE simple-git CHAIN, added 2026-10-10. Four ids, and the reason is a
    # BUILD BREAK, not a judgement that the advisory is unimportant.
    #
    # All four need simple-git >=4.0.1, reached via
    # @sentry/nuxt > nuxt > @nuxt/devtools > simple-git. The override resolves
    # cleanly (4.0.2, and argv-parser lands on 2.0.1 by itself) and then FAILS AT
    # INSTALL: simple-git 4 dropped the default export @nuxt/devtools imports, so
    # apps/studio's postinstall (`nuxt prepare`) dies with "does not provide an
    # export named 'default'". Confirmed by reverting that one line while keeping
    # the other floors — install goes green again. The reasoning is kept beside
    # the floors above, where the next person will look.
    #
    # No upstream cure either: measured against the registry, every published
    # @nuxt/devtools up to 3.4.2 declares `simple-git: ^3.36.0`. That is also why
    # Dependabot's four security-update runs for this chain fail instead of
    # opening PRs.
    #
    # REACHABILITY, measured on a CLEAN build of main 6db1d96 (not an
    # accumulated .output): `simple-git` has **0 occurrences in the whole
    # .output** — not just node_modules — and 0 string hits in index.mjs and the
    # chunks. @nuxt/devtools is not in the artifact either. Positive controls in
    # the same run: devalue, nodemailer and @sentry are all present, and
    # nodemailer gives 1 string hit, so the search does find what is there.
    #
    # ⚠️ One correction worth keeping, because it nearly went the other way: a
    # first pass reported "3 @nuxt/devtools occurrences" in the artifact. Those
    # were `@vue/devtools-api` — a different package the glob matched on the
    # basename. The vulnerable chain is absent; the neighbour is not.
    #
    # NAMED, not `--ignore-unfixable`: the blanket flag would absorb the next
    # unfixable critical with nobody deciding to. 🔴 DELETE THESE FOUR when
    # @nuxt/devtools ships simple-git 4 — this is the one blocker left in BOTH
    # grundtone and grundtone-studio, and the same four ids are excepted in
    # grundtone (#259).
    - GHSA-x6jw-m9v5-85vh
    - GHSA-v5rq-49vh-5v5c
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
    # braces stack-exhaustion DoS via deeply nested patterns (CVE-2026-93687).
    # Path: @nuxtjs/i18n > @intlify/unplugin-vue-i18n > fast-glob > micromatch.
    # Glob expansion over our own file paths at build time; the patterns are not
    # attacker-controlled.
    - GHSA-vfj7-8cjw-p6xm
    # node-forge RSA PKCS#1 v1.5 signature verification accepts extra nested
    # DigestAlgorithm elements (CVE-2026-85393). Path: nuxt > @nuxt/cli >
    # listhen, which uses it to mint a self-signed cert for the dev server.
    # 🔴 This is a signature-verification weakness, not a DoS — a heavier class
    # than the braces one. It is excepted on reachability alone: @nuxt/cli is not
    # in the production image.
    - GHSA-86w9-cpqp-85rv
