packages:
  - apps/*
  - packages/*

# Force-bump transitive deps that have a high-severity advisory the upstream
# owner hasn't picked up yet. Each override needs a justification line — re-
# evaluate periodically and remove once the natural tree resolves to the same
# or newer version.
#
# Note: migrated here from package.json's pnpm.overrides because pnpm 10
# ignores that field (warns: "no longer read by pnpm").
overrides:
  # GHSA-77vg-94rm-hx3p — DoS via sparse-array deserialization in 5.6.3–5.8.0.
  # Pulled in by @nuxtjs/i18n; remove when that package bumps.
  devalue: ^5.8.1
  # GHSA-w7jw-789q-3m8p — critical: shell-quote quote() does not escape
  # newlines in object .op values (patched 1.8.4). Plus a later quadratic-
  # complexity DoS in parse() patched in 1.9.0 — floor raised to cover both.
  # Pulled in by @nuxt/devtools > launch-editor (transitive through
  # @sentry/nuxt > nuxt).
  shell-quote: ^1.9.0
  # GHSA — critical node-tar decompression/parse DoS (unlimited input) plus a
  # high infinite-loop on negative entry size; both patched in 7.5.19. Pulled
  # in via @sentry/nuxt > nuxt > nitropack > @vercel/nft > @mapbox/node-pre-gyp.
  # (+ opfølger patched 7.5.21 — decompression-DoS-fixet i 7.5.19/20 var
  # utilstrækkeligt; gulvet hævet så prod-audit-gaten forbliver grøn.)
  tar: '>=7.5.21'
  # GHSA — high: js-yaml quadratic/exponential parse-time DoS. The old merge-key
  # advisory was patched in 4.3.0; a newer exponential-parse-time-in-flow-
  # collections advisory (vuln 5.0.0–5.2.1) is patched in 5.2.2.
  # RANGE-SCOPED, ikke blanket: read-yaml-file@1.x (changesets-kæden) deklarerer
  # js-yaml ^3 og kalder safeLoad, som er FJERNET i v4+ — den blanke '>=5.2.2'
  # knækkede release-workflowets changesets-publish med "yaml.safeLoad is not a
  # function" (samme brud som grundtone#113; 3.x er ikke i advisory-spannene).
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0'
  # GHSA-mh99-v99m-4gvg — high: brace-expansion OOM-crash DoS via unbounded
  # expansion. The advisory marks EVERY version <=5.0.7 vulnerable across all
  # major lines and patches only in 5.0.8, so the earlier "keep 2.x on 2.1.2"
  # scoping is no longer sufficient. Force the whole 2.x–5.0.7 span (reached via
  # multiple minimatch parents: eslint, and archiver>glob) up to 5.0.8. The 1.x
  # line (<2.0.0, used by minimatch@3) is left untouched — a flat 5.x bump there
  # risks the CJS/ESM break the original scoping guarded against; no 1.x
  # brace-expansion is in the prod tree (audit confirms green).
  # (+ opfølger patched 5.0.9 — 5.0.8-mitigeringen af CVE-2026-14257 kunne
  # omgås; span + gulv hævet tilsvarende.)
  'brace-expansion@>=2.0.0 <5.0.9': '>=5.0.9'
  # GHSA — high (x2): Immutable.js List 32-bit trie overflow + Map/Set hash-
  # collision algorithmic-complexity DoS; both patched in 5.1.8. Pulled in via
  # @nuxtjs/i18n > @intlify/unplugin-vue-i18n > vite > sass. Remove when sass
  # drops the immutable dep or bumps it.
  immutable: '>=5.1.8'
  # GHSA — high: SVGO removeScripts plugin leaves some executable scripts
  # intact; patched in 4.0.2. Pulled in via @sentry/nuxt > nuxt > cssnano >
  # postcss-svgo. Build-time SVG optimization only.
  svgo: '>=4.0.2'
  # GHSA — high (x2): fast-uri host confusion via literal-backslash authority
  # delimiter + failed IDN canonicalization; both patched in 3.1.4. Pulled in
  # via @sentry/nuxt > nuxt > vite-plugin-checker > stylelint > table > ajv.
  # (+ opfølger i 4.x-linjen patched 4.1.2 — samme advisory-familie ramte
  # >=4.0.0 <4.1.2; gulvet hævet så prod-audit-gaten forbliver grøn.)
  fast-uri: '>=4.1.2'
  # GHSA — high: PostCSS path traversal in previous-source-map auto-loading
  # (sourceMappingURL) → arbitrary .map file disclosure; patched in 8.5.18.
  # Pulled in via @nuxtjs/i18n > @intlify/unplugin-vue-i18n > vite. Stable
  # within the 8.x line.
  postcss: '>=8.5.18'
  # GHSA-gv7w-rqvm-qjhr — high: esbuild missing binary integrity verification
  # in Deno module enables RCE via NPM_CONFIG_REGISTRY; patched in 0.28.1.
  # Pulled in by @nuxtjs/i18n + nitropack + sentry chain.
  esbuild: ^0.28.1
  # GHSA-c76h-2ccp-4975 — high: undici unbounded memory consumption in WebSocket
  # permessage-deflate decompression; patched in 6.24.0. Pulled in (prod) by
  # @connectrpc/connect-node@1.7.0, which pins ^5.28.4 — its 1.x line never bumps
  # past undici 5, and connect-node 2.x needs @klanghaus/permissions-client
  # regenerated for connect/protobuf 2.x first. Studio's PDP client uses HTTP/2
  # (Node http2, not undici), so this only silences the audit path. Remove once
  # the connect stack moves to 2.x.
  undici: ^6.24.0
